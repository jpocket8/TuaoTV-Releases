name: Publish daily maths practice
on:
  push:
    paths: ['learning/learning-bank.py', '.github/workflows/learning.yml']
  schedule:
    # Brisbane 05:15 (UTC+10, no daylight saving); hosted schedules may run late.
    - cron: '15 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: learning-bank
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            learning
      - name: Generate and verify five new questions per year level
        run: python3 learning/learning-bank.py --output learning/math-v1.json
      - name: Publish only validated content
        run: |
          git config user.name 'TuaoTV Learning'
          git config user.email 'actions@users.noreply.github.com'
          git add learning/math-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily maths practice'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
